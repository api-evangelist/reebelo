      https://cobalt.reebelo.com/documentation/linnworks and ships a Reebelo
      application into the Linnworks app catalogue, so this connector is Reebelo-built
      even though it is distributed on Linnworks' platform rather than a package
      registry.
  - name: Shopify
    official: false
    note: >-
      Reebelo documents a Shopify connector setup at
      https://cobalt.reebelo.com/documentation/shopify using a custom Admin API app
      with read_products, read_draft_orders, write_draft_orders and read_orders scopes.
      Reebelo consumes the vendor's Shopify store; it does not publish a Shopify app of
      its own to the public app store.
