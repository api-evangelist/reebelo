summary: >-
  Reebelo publishes no client libraries. There is no first-party SDK on any public
  registry, no GitHub organization, and no SDK or code-sample section in the Custom API
  documentation. Vendors integrate either by calling the REST endpoints directly, by
  hosting CSV feeds, or through a third-party channel-management platform that has
  built its own Reebelo connector.
