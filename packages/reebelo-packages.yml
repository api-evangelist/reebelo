  - name: Neto / Maropost Commerce Cloud
    official: false
    note: Reebelo publishes setup steps at https://cobalt.reebelo.com/documentation/neto
gaps:
- >-
  No SDK in any language, so every integrator hand-rolls HTTP calls, request signing
  (a single header) and pagination.
- >-
  No public repository of any kind means no issue tracker, no versioned client, and no
  community-visible changelog.
