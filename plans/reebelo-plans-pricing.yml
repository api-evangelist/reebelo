summary: >-
  Reebelo publishes no pricing for its vendor programme or its API. There is no plans
  page, no tier table, no free tier and no self-service signup anywhere on reebelo.com
  or cobalt.reebelo.com. Reebelo's own help centre answers the question "I am
  interested to be a vendor. Who do I contact?" by directing prospective sellers to
  email support@reebelo.com with their company details — the vendor programme is a
  sales-gated relationship, and API access is a downstream consequence of being
  accepted as a vendor rather than a separately priced product.
