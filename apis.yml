apis:
- aid: reebelo-vendor-api
  name: Reebelo Vendor Integration API (Cobalt)
  description: 'The seller-side REST API behind Reebelo''s Cobalt vendor back-office.
    Authenticated with a Reebelo-issued x-api-key header, it exposes offer
    management (list offers, look up an offer by SKU, create/update offers with
    price, stock and minimum price), order retrieval (paged and sorted, with
    orderDate/fulfillmentDate/dispatchDate ranges), order tracking updates (carrier
    and tracking number), IMEI capture per line item, and a presigned-URL flow for
    uploading seller invoice PDFs. Reebelo also forwards new orders to a
    vendor-hosted webhook endpoint, and offers hosted-CSV product and tracking
    feeds as a no-API alternative.'
  humanURL: https://cobalt.reebelo.com/documentation/custom-api
  baseURL: https://a.reebelo.com
