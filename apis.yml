aid: reebelo
name: Reebelo
description: 'Reebelo is a marketplace for certified refurbished consumer technology
  — smartphones, laptops, tablets, smartwatches, gaming and home electronics — sold
  by a vetted network of third-party refurbishers at up to 70% below new, with a
  12-month warranty and a 30-day trial. Founded in 2019 and operating in the United
  States, Australia, New Zealand and Singapore, Reebelo positions refurbished tech
  as the sustainable alternative to new-device purchase. Its developer surface is
  seller-facing rather than buyer-facing: the Cobalt vendor back-office publishes a
  REST integration API on https://a.reebelo.com that lets a refurbisher list and
  reprice offers, pull orders, push carrier tracking and IMEI numbers, and upload
  seller invoices, alongside hosted-CSV feed and order-forwarding webhook
  alternatives for vendors without API resources.'
